# Alembic configuration for Electrical Project Standalone DB.
#
# The database URL is intentionally NOT set here -- alembic/env.py imports it
# from app.config so the application and the migrations always agree on which
# database they target (and a future PostgreSQL switch is a one-line change).

[alembic]
script_location = alembic
prepend_sys_path = .
# Use OS-native path separators for generated version files.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
